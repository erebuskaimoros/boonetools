<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">Monthly TRX and USDT liquidity fees</title>
  <desc id="desc">Grouped bars show monthly liquidity fees from October 2025 through July 18, 2026. TRX totaled 63.2 thousand dollars and USDT totaled 214.4 thousand dollars. May and June were affected by the THORChain halt.</desc>
  <style>
    :root { --bg: #080808; --fg: #e8e8e8; --muted: #888888; --grid: #1a1a1a; --trx: #00cc66; --usdt: #d4a017; --halt: #111111; }
    text { font-family: "JetBrains Mono", ui-monospace, monospace; fill: var(--fg); }
    .muted { fill: var(--muted); font-size: 13px; }
    .label { font-size: 14px; font-weight: 500; }
    .title { font-size: 22px; font-weight: 500; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .trx { fill: var(--trx); }
    .usdt { fill: var(--usdt); }
  </style>
  <rect width="1000" height="440" fill="var(--bg)"/>
  <text class="title" x="90" y="34">Monthly liquidity fees (USD)</text>
  <rect class="trx" x="90" y="48" width="12" height="12" rx="2"/><text class="muted" x="110" y="59">TRX · $63.2K total</text>
  <rect class="usdt" x="260" y="48" width="12" height="12" rx="2"/><text class="muted" x="280" y="59">USDT · $214.4K total</text>

  <rect x="706" y="70" width="176" height="280" fill="var(--halt)" opacity="0.58"/>
  <text class="muted" x="794" y="87" text-anchor="middle">halt affected</text>

  <line class="grid" x1="90" y1="70" x2="970" y2="70"/><text class="muted" x="80" y="75" text-anchor="end">$100K</text>
  <line class="grid" x1="90" y1="140" x2="970" y2="140"/><text class="muted" x="80" y="145" text-anchor="end">$75K</text>
  <line class="grid" x1="90" y1="210" x2="970" y2="210"/><text class="muted" x="80" y="215" text-anchor="end">$50K</text>
  <line class="grid" x1="90" y1="280" x2="970" y2="280"/><text class="muted" x="80" y="285" text-anchor="end">$25K</text>
  <line class="grid" x1="90" y1="350" x2="970" y2="350"/><text class="muted" x="80" y="355" text-anchor="end">$0</text>

  <rect class="trx" x="108" y="345.6" width="24" height="4.4" rx="2"/><rect class="usdt" x="136" y="334.6" width="24" height="15.4" rx="2"/>
  <rect class="trx" x="196" y="347.5" width="24" height="2.5" rx="2"/><rect class="usdt" x="224" y="319.8" width="24" height="30.2" rx="2"/>
  <rect class="trx" x="284" y="345.3" width="24" height="4.7" rx="2"/><rect class="usdt" x="312" y="320.6" width="24" height="29.4" rx="2"/>
  <rect class="trx" x="372" y="344.8" width="24" height="5.2" rx="2"/><rect class="usdt" x="400" y="308.5" width="24" height="41.5" rx="2"/>
  <rect class="trx" x="460" y="264.4" width="24" height="85.6" rx="2"/><rect class="usdt" x="488" y="305.5" width="24" height="44.5" rx="2"/>
  <rect class="trx" x="548" y="334.7" width="24" height="15.3" rx="2"/><rect class="usdt" x="576" y="300.1" width="24" height="49.9" rx="2"/>
  <rect class="trx" x="636" y="315.1" width="24" height="34.9" rx="2"/><rect class="usdt" x="664" y="218.6" width="24" height="131.4" rx="2"/>
  <rect class="trx" x="724" y="342.0" width="24" height="8.0" rx="2"/><rect class="usdt" x="752" y="299.1" width="24" height="50.9" rx="2"/>
  <rect class="trx" x="812" y="348.9" width="24" height="1.1" rx="1"/><rect class="usdt" x="840" y="342.4" width="24" height="7.6" rx="2"/>
