  <text class="label" x="472" y="255" text-anchor="middle">$30.6K</text>
  <text class="label" x="940" y="141" text-anchor="middle">$71.2K</text>

  <text class="muted" x="134" y="377" text-anchor="middle">Oct</text><text class="muted" x="222" y="377" text-anchor="middle">Nov</text>
  <text class="muted" x="310" y="377" text-anchor="middle">Dec</text><text class="muted" x="398" y="377" text-anchor="middle">Jan</text>
