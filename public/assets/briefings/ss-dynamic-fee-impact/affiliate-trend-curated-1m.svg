  <title id="chart-title">SS one-month affiliate trend, curated</title>
  <desc id="chart-desc">CURATED daily executed-leg volume bars, historical liquidity-fee bars, fees-per-volume line, and trailing 30- and 90-day average-volume lines from 2026-06-27 through 2026-07-26. Both rolling averages remove full halt days from numerator and denominator and are blank on those days.</desc>
