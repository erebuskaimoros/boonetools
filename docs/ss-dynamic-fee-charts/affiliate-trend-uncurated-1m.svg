  <title id="chart-title">SS one-month affiliate trend, uncurated</title>
  <desc id="chart-desc">UNCURATED daily executed-leg volume bars, historical liquidity-fee bars, fees-per-volume line, and trailing 30- and 90-day average-volume lines from 2026-06-27 through 2026-07-26. The rolling averages divide the trailing 30 and 90 calendar buckets by 30 and 90, respectively.</desc>
